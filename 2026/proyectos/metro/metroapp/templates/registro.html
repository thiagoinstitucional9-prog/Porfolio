<!DOCTYPE html>
<html>

<head>
    <title>Registro - Metro</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .login h1 {
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .login h1::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, #fe0000, #ff4444);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #fe0000;
            box-shadow: 0 0 0 4px rgba(254, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fe0000, #cc0000);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 20px;
        }

        button:hover {
            background: linear-gradient(135deg, #ff1a1a, #fe0000);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(254, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #fe0000;
            background: rgba(254, 0, 0, 0.1);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(254, 0, 0, 0.3);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        a {
            display: block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #fe0000;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>CREAR CUENTA</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <a href="{% url 'login' %}">
        Volver al login
    </a>

</div>

</body>

</html>
